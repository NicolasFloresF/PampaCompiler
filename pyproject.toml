[project]
name = "pampa-compiler"
version = "0.1.0"
description = "Educational compiler that translates Portugol into x86-64 assembly"
readme = "README.md"
authors = [{ name = "NicolasFloresF", email = "nick.lasff@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.20.3",
    "ply>=3.11",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
